name: AI Resume Analyzer CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Checkout
      # -------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------
      # Backend
      # -------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------
      # Frontend
      # -------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # -------------------------
      # Docker Login
      # -------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # Build Backend Image
      # -------------------------

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-resume-backend:latest \
            ./backend

      # -------------------------
      # Build Frontend Image
      # -------------------------

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-resume-frontend:latest \
            ./frontend

      # -------------------------
      # Push Images
      # -------------------------

      - name: Push Backend Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-resume-backend:latest

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-resume-frontend:latest